## AI-Assisted

## Local secret-isolation audit for developer-meta-files. Manual
## (workflow_dispatch) sanity check: the AI-review key is forwarded and
## no unrelated secret (OpenAI, Coverity) leaks into this repo's secrets
## context. Runs the migrated dist-ai audit script directly -- this is
## the one remaining secrets-audit workflow; the reusable + consumer
## variants are decommissioned.
##
## Presence booleans resolve at expression-evaluation time, so secret
## values themselves never reach env or step output.

name: Secrets surface audit (local)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Secrets surface audit
    runs-on: ubuntu-latest
    ## Runner provisioning + the cross-repo dist-ai checkout can eat a 60s
    ## budget under contention, cancelling before the audit (and the
    ## always()-summary that reads the checkout) can run.
    timeout-minutes: 5
    ## Pin to org-ai-assisted so no other repo's workflow can use the
    ## AI-review secret, ANDed with the org-wide CI-enabled switch every
    ## workflow of ours carries.
    if: >-
      ${{ github.repository == 'org-ai-assisted/developer-meta-files'
      && vars.CI_ENABLED_ORG_AI_ASSISTED == 'true' }}
    permissions: {}
    env:
      ## dmf is not dist-ai, so this resolves to 'master' -- the migrated
      ## audit script is consumed from dist-ai master.
      DIST_AI_REF: ${{ github.repository == 'org-ai-assisted/dist-ai' && github.sha || 'master' }}
      CLAUDE_OAUTH_PRESENT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      OPENAI_PRESENT: ${{ secrets.OPENAI_API_KEY != '' }}
      COVERITY_TOKEN_PRESENT: ${{ secrets.COVERITY_SCAN_TOKEN != '' }}
      COVERITY_EMAIL_PRESENT: ${{ secrets.COVERITY_SCAN_EMAIL != '' }}
    steps:
      - name: Checkout dist-ai (shared CI helper scripts)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: org-ai-assisted/dist-ai
          ref: ${{ env.DIST_AI_REF }}
          path: .github/dist-ai
          persist-credentials: false

      - name: Probe secrets surface
        run: .github/dist-ai/ci/secrets-audit.sh

      - name: Emit step summary
        if: always()
        ## Route values through env and consume with shell-native
        ## expansion inside run: to avoid expression interpolation in
        ## shell arguments (CodeQL js/actions/command-injection). The
        ## present/absent resolution happens server-side before the env
        ## var is assigned, so the shell only sees a constant string.
        env:
          CLAUDE_OAUTH_LABEL: ${{ env.CLAUDE_OAUTH_PRESENT == 'true' && 'present' || 'absent' }}
          OPENAI_LABEL: ${{ env.OPENAI_PRESENT == 'true' && 'present' || 'absent' }}
          COVERITY_TOKEN_LABEL: ${{ env.COVERITY_TOKEN_PRESENT == 'true' && 'present' || 'absent' }}
          COVERITY_EMAIL_LABEL: ${{ env.COVERITY_EMAIL_PRESENT == 'true' && 'present' || 'absent' }}
          JOB_STATUS: ${{ job.status }}
        run: |
          ./.github/dist-ai/usr/bin/step-summary-emit \
            --tool 'Secrets surface audit' \
            --column-header secret \
            --row "CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_OAUTH_LABEL}" \
            --row "OPENAI_API_KEY=${OPENAI_LABEL}" \
            --row "COVERITY_SCAN_TOKEN=${COVERITY_TOKEN_LABEL}" \
            --row "COVERITY_SCAN_EMAIL=${COVERITY_EMAIL_LABEL}" \
            --row "outcome=${JOB_STATUS}"
